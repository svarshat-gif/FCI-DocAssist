name: Remove Expired Uploads
on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: upload-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Remove expired temporary documents
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRAWLER_JOB_TOKEN: ${{ secrets.CRAWLER_JOB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CRAWLER_JOB_TOKEN"
          case "$BACKEND_URL" in https://*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 180 \
            --request POST --header "Authorization: Bearer $CRAWLER_JOB_TOKEN" \
            "$BACKEND_URL/api/v1/maintenance/cleanup"
