services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fci_docassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fci_docassist"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: FCI AI Circular Assistant
      ENVIRONMENT: production
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/fci_docassist
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      EMBEDDING_MODEL: BAAI/bge-m3
      CHROMA_PATH: /app/.chroma
      CHROMA_COLLECTION: fci_circulars
      FCI_CIRCULAR_URLS: ${FCI_CIRCULAR_URLS:-https://fci.gov.in/}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chroma_data:/app/.chroma

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
